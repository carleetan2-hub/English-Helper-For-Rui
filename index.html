ake. “It is one square kilometre,” says the traveller. “Is it deep?” Alex asks. “Yes, very deep.” They take photos and promise to explore more wonders together.", "亚历克斯喜欢探索自然奇观。他去了炎热的沙漠、绿色的草原和很深的湖。瀑布又宽又有名。在高原上，他遇到一位年轻的旅行者。他们都对大自然感兴趣。他们聊起那个湖。旅行者说：“它有一平方千米。”亚历克斯问：“它深吗？”“很深。”他们拍了照片，约定以后一起探索更多奇观。"], "4": ["John is a young inventor. He makes a bird feeder with cloth, string and glue. First he folds the cloth. Then he ties it with string. He also makes a fan from the same material. His invention can help the birds. At school, his friends are interested in his invention. A girl asks, “What material did you use?” John says, “Just cloth, string and glue. Anyone can do it easily!” They make more bird feeders together and hang them near the window.", "约翰是一位年轻的发明家。他用布、细绳和胶水做了一个鸟食罐。首先他把布折好，然后用细绳系住。他还用同样的材料做了一把扇子。他的发明可以帮助小鸟。在学校，朋友们对他的发明很感兴趣。一个女孩问：“你用了什么材料？”约翰说：“只用布、细绳和胶水。人人都能轻松做到！”他们一起做了更多鸟食罐，挂在窗户附近。"], "5": ["Green has a headache, a fever and a sore throat. His nose is runny too. “What’s the matter?” asks Mum. “It may be the flu,” says the doctor. A virus makes him ill, so he rests at home. He gladly takes his medicine. After three days, Green feels fine again. His throat is not sore and the fever is gone. “Wash your hands often,” says the doctor, “and a virus can’t catch you so easily.” Green smiles. “I will!”", "格林头痛、发烧，喉咙还痛，鼻子也在流鼻涕。妈妈问：“怎么了？”医生说：“可能是流感。”病毒让他生病了，所以他在家休息。他很乐意地吃药。三天后，格林又好了。他的喉咙不痛了，烧也退了。医生说：“要经常洗手，这样病毒就不容易找上你。”格林笑着说：“我会的！”"], "6": ["Penny stands on the bridge and enjoys the view. “Good luck!” says her friend. In April, they go to see the Water-splashing Festival. People splash water on each other. It is a pretty cultural event, and Penny wants to speak with the people there. Then Penny looks at the long bridge again. “What a pretty view!” she says. She takes a deep breath and smiles. “I love April in this place. What a lucky day!”", "彭妮站在桥上欣赏景色。朋友说：“祝你好运！”四月，他们去看泼水节。人们互相泼水。这是一个漂亮的文化活动，彭妮想和那里的人们交谈。然后彭妮又看了看那座长长的桥。她说：“多漂亮的景色！”她深吸一口气，笑了。“我爱这里的四月。多么幸运的一天！”"]},SC={"3":
